# Phase 3 (C08): checks on every push and pull request.
# No secrets are used or needed: unit tests run against an in-memory database
# and mocked providers; end-to-end tests (which need a running dev server and
# the dev Supabase project) stay a local step (scripts/e2e-dev.mjs).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: No env files or keys committed
        run: node scripts/check-repo-secrets.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (correctness rules; formatting clean-up is tracked as C32)
        run: npm run lint:ci

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        # vite.config.ts has no Supabase default (src/lib/public-env.ts), so CI builds against
        # placeholder public values: never a real project, never the live database.
        env:
          VITE_SUPABASE_URL: https://ciplaceholder0000000.supabase.co
          VITE_SUPABASE_PROJECT_ID: ciplaceholder0000000
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm run build

      - name: No server secrets in the client bundle
        run: node scripts/check-client-bundle.mjs

      - name: Dependency audit (production; high and critical fail unless accepted in scripts/check-audit.mjs)
        run: node scripts/check-audit.mjs

  # R6 (31 Oct 2026): a pull request from a Lovable branch may change only the UI files in
  # .github/lovable-allowed-paths.txt; anything else needs the owner (.github/CODEOWNERS).
  # Skipped for every other branch, which GitHub counts as passing.
  lovable-path-guard:
    if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'lovable/') || github.head_ref == 'lovable-sync')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Lovable may change only UI files
        # The guard and the allowlist come from the base branch, so a pull request cannot loosen
        # its own check. The ref reaches the shell through env, never by interpolation.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git show "origin/$BASE_REF:scripts/check-lovable-paths.mjs" > "$RUNNER_TEMP/check-lovable-paths.mjs"
          git show "origin/$BASE_REF:.github/lovable-allowed-paths.txt" > "$RUNNER_TEMP/lovable-allowed-paths.txt"
          node "$RUNNER_TEMP/check-lovable-paths.mjs" "origin/$BASE_REF" --allowlist "$RUNNER_TEMP/lovable-allowed-paths.txt"
