# Keeps package-lock.json in sync with package.json so CI's `npm ci` stays green.
# When a push to main changes package.json without updating the lock file
# (for example dependencies installed with bun), this workflow regenerates the
# lock file and commits it back. The follow-up commit then triggers CI again.
name: Lockfile sync

on:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: write

concurrency:
  group: lockfile-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Commit and push if the lock file changed
        run: |
          if git diff --quiet package-lock.json; then
            echo "Lock file already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync package-lock.json with package.json"
          git push
